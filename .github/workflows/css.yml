name: css

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  built-css:
    name: Committed CSS matches the source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build:css
      - run: git diff --exit-code -- css/app.css
